services:
  # Hot-reload Nuxt: ./dc.sh dev  (or: docker compose -f _dev.yml up -d --build)
  # Does not start with plain `docker compose up`.
  dns01-proxy-dev:
    image: oven/bun:canary-alpine
    container_name: dns01-proxy-dev
    working_dir: /app
    command: ["sh", "-c", "bun install --frozen-lockfile && exec bun run dev"]
    ports:
      - "3000:3000"
      - "15353:15353"
      - "15353:15353/udp"
    volumes:
      - ./src/dns01-proxy:/app
      - dns01-proxy-dev-modules:/app/node_modules  # Linux modules inside the container
    environment:
      # ── Paths (package-local .data on the bind mount) ───────────────────────────
      - ACMEDNS_DATA_ROOT=.data
      - ACMEDNS_LETSENCRYPT_DIR=.data/letsencrypt
      # Seed listens on 127.0.0.1 — override so published :15353 reaches the host.
      - ACME_DNS_LISTEN=0.0.0.0
      - HOST=0.0.0.0
      - NITRO_HOST=0.0.0.0
      # ── System ──────────────────────────────────────────────────────────────────
      - TZ=${TZ:-UTC}
      - ADMINISTRATOR_PASSWORD=${ADMINISTRATOR_PASSWORD:-}
      # ── Domain (APEX derives auth URL + LE email when unset — see core/env.ts) ───
      - APEX=${APEX:-}
      - AUTH_DOMAIN=${AUTH_DOMAIN:-auth.${APEX}}
      # ── ACME / certs ────────────────────────────────────────────────────────────
      - ACMEDNS_URL=${ACMEDNS_URL:-}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
      - RENEW_INTERVAL=${RENEW_INTERVAL:-12}
      - CERTS_ACME_DISABLED=${CERTS_ACME_DISABLED:-false}
      - CERTS_RENEW_DISABLED=${CERTS_RENEW_DISABLED:-false}
      # ── Tiny stack (optional — see .wiki/Tiny-stack.md) ───────────────────────
      - ACMEDNS_TINY_DOMAIN=${ACMEDNS_TINY_DOMAIN:-}
      - ACMEDNS_TINY_MODE=${ACMEDNS_TINY_MODE:-}
      - ACMEDNS_TINY_SHARED_KEY=${ACMEDNS_TINY_SHARED_KEY:-}
      - ACMEDNS_PUBLIC_IP=${ACMEDNS_PUBLIC_IP:-}
      - ACMEDNS_PUBLIC_IPV6=${ACMEDNS_PUBLIC_IPV6:-}
      - NUXT_ACME_DNS_DEFAULT_CONFIG=${NUXT_ACME_DNS_DEFAULT_CONFIG:-}
      # ── Frontend (Register form; inherits ACMEDNS_URL unless overridden) ────────
      - NUXT_PUBLIC_DEFAULT_ACMEDNS_URL=${NUXT_PUBLIC_DEFAULT_ACMEDNS_URL:-${ACMEDNS_URL:-}}

volumes:
  dns01-proxy-dev-modules:
#   letsencrypt:
#     name: letsencrypt
