services:
  acmedns-server:
    build:
      context: build/acmedns-server
      dockerfile: Dockerfile
    container_name: acmedns-server
    restart: unless-stopped
    ports:
      - "53:53"
      - "53:53/udp"
    volumes:
      - ./data/acmedns-server/config:/etc/acme-dns
      - ./data/acmedns-server/data:/var/lib/acme-dns
      - letsencrypt:/etc/letsencrypt:ro
    networks:
      - default

  acmedns-client:
    build:
      context: build/acmedns-client
      dockerfile: Dockerfile
    container_name: acmedns-client
    restart: unless-stopped
    ports:
      - "82:3000"
    volumes:
      - acmedns-client:/app/data:rw
    environment:
      - CLIENTSTORAGE_DATA=/app/data/clientstorage.json
      - ACMEDNS_URL=${ACMEDNS_URL:-http://acmedns-server}
      - NUXT_PUBLIC_DEFAULT_ACMEDNS_URL=${ACMEDNS_URL:-http://acmedns-server}
    entrypoint:
      - /bin/sh
      - -c
      - |
          set -e
          if [ ! -s /app/data/clientstorage.json ]; then
            echo '{}' > /app/data/clientstorage.json
          fi
          exec bun .output/server/index.mjs
    networks:
      - default

  acmedns-letsencrypt:
    build:
      context: build/acmedns-letsencrypt
      dockerfile: Dockerfile
    container_name: acmedns-letsencrypt
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - letsencrypt-logs:/var/log/certbot
      - acmedns-client:/config/acmedns-client:ro
      - ./data/acmedns-letsencrypt:/config/host
    environment:
      - ACMEDNS_URL=${ACMEDNS_URL:-http://acmedns-server}
      - STORAGE_PATH=${STORAGE_PATH:-/config/acmedns-client/clientstorage.json}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-admin@example.com}
      - RENEW_INTERVAL=${RENEW_INTERVAL:-12}
      - TZ=${TZ:-UTC}
    depends_on:
      - acmedns-server
      - acmedns-client
    networks:
      - default

volumes:
  letsencrypt:
    name: letsencrypt
  acmedns-client:
    name: acmedns-client
  letsencrypt-logs:
    name: letsencrypt-logs
