# Overlay for Hub multi-arch publishes (self-contained; not merged with build.yml).
# Multi-arch cannot be loaded into the local Docker engine, so local
# `./dc.sh build` stays on _build.yml only.
services:
  dns01-proxy:
    build:
      context: src/dns01-proxy
      dockerfile: Dockerfile.platform
      platforms:
        - linux/amd64
        - linux/arm64
    image: harianto/dns01-proxy:latest

