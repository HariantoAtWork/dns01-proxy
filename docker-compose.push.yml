# Overlay for Hub publishes. Merge after docker-compose.build.yml.
# Multi-arch cannot be loaded into the local Docker engine, so local
# `docker:build` stays on docker-compose.build.yml only.
services:
  acmedns-nuxt:
    build:
      context: build/acmedns-nuxt
      dockerfile: Dockerfile.platform
      platforms:
        - linux/amd64
        - linux/arm64
    image: harianto/acmedns-nuxt:latest

