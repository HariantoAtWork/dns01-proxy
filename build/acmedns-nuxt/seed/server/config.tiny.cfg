[general]
# Tiny stack — no per-domain UUID registration.
# Point at your registrar: _acme-challenge.example.com CNAME auth.uti.email
listen = "0.0.0.0:53"
protocol = "both"
domain = "auth.uti.email"
nsname = "auth.uti.email"
nsadmin = "admin.uti.email"
records = [
    "auth.uti.email. A 198.51.100.1",
    "auth.uti.email. NS auth.uti.email.",
]
debug = false

[database]
engine = "sqlite"
connection = "/var/lib/acmedns-stack/server/acme-dns.db"

[api]
ip = "0.0.0.0"
port = "80"
disable_registration = true
shared_mode = true
shared_username = "00000000-0000-4000-8000-000000000001"
# Optional fixed key (43-char base64url). Otherwise auto-generated on first boot.
# shared_password = ""
tls = "none"
corsorigins = [
    "*"
]
use_header = false
header_name = "X-Forwarded-For"

[logconfig]
loglevel = "info"
logtype = "stdout"
logformat = "text"
