[general]
# Production seed — copied to $ACMEDNS_DATA_ROOT/server/config.cfg when missing.
# Code defaults (when a key is omitted) live in server/utils/config.ts DEFAULTS.
# Local `bun run dev` uses seed/config.dev.cfg instead.

# listen — optional; code default "0.0.0.0:53".
# Override host/port via ACME_DNS_LISTEN / DNS_LISTEN or ACME_DNS_PORT / DNS_PORT.
listen = "0.0.0.0:53"
protocol = "both"
domain = "auth.example.org"
nsname = "auth.example.org"
nsadmin = "admin.example.org"
records = [
    # Replace 198.51.100.1 (TEST-NET-2) with your real public IP.
    "auth.example.org. A 198.51.100.1",
    "auth.example.org. NS auth.example.org.",
]
debug = false

[database]
engine = "sqlite"
# Absolute path under ACMEDNS_DATA_ROOT/server/
connection = "/var/lib/acmedns-stack/server/acme-dns.db"

[api]
ip = "0.0.0.0"
disable_registration = false
port = "80"
tls = "none"
corsorigins = [
    "*"
]
use_header = false
header_name = "X-Forwarded-For"

[logconfig]
loglevel = "info"
logtype = "stdout"
logformat = "text"
