[general]
# Copied to config/config.cfg on first `bun run dev` if that file is missing.
# DNS listen address. Seed uses loopback + high port for local `bun run dev`.
# Docker/production typically listens on 0.0.0.0:53 (or 53 with CAP_NET_BIND_SERVICE).
# Note that systemd-resolved may reserve port 53 on 127.0.0.53
listen = "127.0.0.1:15353"
# protocol, "both", "both4", "both6", "udp", "udp4", "udp6" or "tcp", "tcp4", "tcp6"
protocol = "both"
# domain name to serve the requests off of
domain = "auth.example.test"
# zone name server
nsname = "auth.example.test"
# admin email address, where @ is substituted with .
nsadmin = "admin.example.test"
# predefined records served in addition to the TXT
records = [
    # domain pointing to the public IP of your acme-dns server
    # Replace 198.51.100.1 (TEST-NET-2 docs example) with your real public internet IP
    # so Let's Encrypt can follow NS glue / A for auth.example.test (or your domain).
    # Local listen may stay 127.0.0.1 — this A record must be public for ACME DNS-01.
    "auth.example.test. A 198.51.100.1",
    # specify that auth.example.test will resolve any *.auth.example.test records
    "auth.example.test. NS auth.example.test.",
]
# debug messages from CORS etc
debug = true

[database]
# Database engine to use, sqlite or postgres (sqlite3 is still accepted)
engine = "sqlite"
# Connection string, filename for sqlite and postgres://$username:$password@$host/$db_name for postgres
connection = "./.data/acme-dns.db"
# connection = "postgres://user:password@localhost/acmedns_db"

[api]
# listen ip eg. 127.0.0.1
ip = "0.0.0.0"
# disable registration endpoint
disable_registration = false
# listen port (Nuxt/Bun API; Docker may map differently)
port = "3000"
# possible values: "letsencrypt", "letsencryptstaging", "cert", "none"
tls = "none"
# CORS AllowOrigins, wildcards can be used
corsorigins = [
    "*"
]
# use HTTP header to get the client ip
use_header = false
# header name to pull the ip address / list of ip addresses from
header_name = "X-Forwarded-For"

[logconfig]
# logging level: "error", "warning", "info" or "debug"
loglevel = "debug"
# possible values: stdout, TODO file & integrations
logtype = "stdout"
# format, either "json" or "text"
logformat = "text"
