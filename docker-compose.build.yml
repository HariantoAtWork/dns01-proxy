services:
  acmedns-nuxt:
    build:
      context: build/acmedns-nuxt
      dockerfile: Dockerfile
    image: harianto/acmedns-nuxt:latest

  # Keep Go image build for rollback while cutting over to Nuxt.
  acmedns-server:
    build:
      context: build/acmedns-server
      dockerfile: Dockerfile
    image: harianto/acmedns-server:latest

  acmedns-client:
    build:
      context: build/acmedns-client
      dockerfile: Dockerfile
    image: harianto/acmedns-client:latest
